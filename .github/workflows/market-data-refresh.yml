# Nightly market-data refresh: rebuild the backend image only when R2 moved.
#
# Most nights this does nothing: it compares R2's published version against
# backend/.market-data-version and exits. When the publisher ships new chunks,
# it rebuilds (data layer only; code layers are cached), pushes a dated tag +
# latest, records the new version back in the repo, and rolls Cloud Run.
#
# Required GitHub Secrets (repo Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN   (Docker Hub PAT, Read & Write)
#   GCP_SA_KEY            (service-account JSON: Cloud Run Admin,
#                          Service Account User, Secret Manager Admin)
#   GCP_PROJECT_ID        (e.g. sltp-prod-123)
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE,
#   TURSO_DATABASE_URL, TURSO_AUTH_TOKEN   (passed through as Cloud Run env)

name: market-data-refresh

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily; version gate skips no-op nights
  workflow_dispatch: # manual "run it now" button

permissions:
  contents: write # to commit the bumped .market-data-version

env:
  IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/sltp-api
  R2_MANIFEST: https://pub-8fe125f9d291408d9a41fa5228a663e2.r2.dev/META/version.txt

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      version: ${{ steps.diff.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: diff
        run: |
          remote=$(curl -s -A sltp "$R2_MANIFEST" | tr -d '[:space:]')
          local=$(tr -d '[:space:]' < backend/.market-data-version)
          echo "remote=$remote local=$local"
          echo "version=$remote" >> "$GITHUB_OUTPUT"
          if [ "$remote" != "$local" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.check.outputs.version }}
            ${{ env.IMAGE }}:latest

      - name: record baked version
        run: |
          echo "${{ needs.check.outputs.version }}" > backend/.market-data-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/.market-data-version
          git commit -m "Bake market data ${{ needs.check.outputs.version }}" || true
          git push

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: sltp-api
          region: us-central1
          image: ${{ env.IMAGE }}:latest
          flags: --memory=2Gi --cpu=1 --min-instances=0 --max-instances=3 --port=8080
          env_vars: |
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_SERVICE_ROLE=${{ secrets.SUPABASE_SERVICE_ROLE }}
            TURSO_DATABASE_URL=${{ secrets.TURSO_DATABASE_URL }}
            TURSO_AUTH_TOKEN=${{ secrets.TURSO_AUTH_TOKEN }}
