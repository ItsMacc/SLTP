# Keeps the baked data fresh. Once a day it asks R2 for the current data
# version; when the publisher ships new chunks, this commits the new version
# number, and Render auto-rebuilds the image (the Dockerfile bakes the chunks
# in during the build). No deploy step, no registry, no secrets.
#
# Zero GitHub Secrets required. Manual run: Actions -> market-data-refresh
# -> Run workflow.

name: market-data-refresh

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

jobs:
  version-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: compare R2 version with baked version
        run: |
          pip install -q "sltp==0.1.23"
          REMOTE=$(python -c "from sltp.data.remote import read_remote_version; print(read_remote_version())")
          LOCAL=$(cat backend/.market-data-version)
          echo "baked: $LOCAL | R2: $REMOTE"
          if [ "$REMOTE" != "$LOCAL" ]; then
            echo "$REMOTE" > backend/.market-data-version
            git config user.name "market-data-bot"
            git config user.email "market-data-bot@users.noreply.github.com"
            git add backend/.market-data-version
            git commit -m "market data $LOCAL -> $REMOTE (Render rebuilds)"
            git push
          else
            echo "already fresh, nothing to do."
          fi
